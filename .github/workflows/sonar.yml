name: SonarQube

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  airport_service:
    name: Sonar – Airport Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create .env
        working-directory: airport_service
        run: cp .env.example .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: airport_service
        run: |
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: airport_service
        run: |
          pytest --cov=src --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: airport_service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_AIRPORT_TOKEN }}
