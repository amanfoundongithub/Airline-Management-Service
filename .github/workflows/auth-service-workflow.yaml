name: Auth Service CI

# Triggers the workflow only when changes occur within the 'auth_service' directory
on:
  push:
    branches: [ "develop" ] # Only runs when code is pushed to the develop branch
    paths:
      - 'auth_service/**'
  pull_request:
    branches: [ "develop" ] # Runs when a PR targets the develop branch
    paths:
      - 'auth_service/**'

jobs:
  test_auth_service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth_service
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx 

    - name: Set Environment Variables for Testing (MOCK VALUES)
      # These variables must be provided for settings.py to initialize correctly.
      run: |
        # --- Mongo Variables ---
        echo "MONGO_URI=mongodb://localhost:27017/" >> $GITHUB_ENV
        echo "MONGO_DB_NAME=auth_service_test_ci" >> $GITHUB_ENV
        echo "MONGO_COLLECTION_NAME=users_test" >> $GITHUB_ENV
        
        # --- Environment Variables ---
        echo "DEBUG_MODE=False" >> $GITHUB_ENV
        
        # --- Security Variables ---
        echo "JWT_SECRET_KEY=a_strong_secret_key_for_ci_testing_999" >> $GITHUB_ENV
        
    - name: Run Code Linting (Quality Check)
      run: |
        pip install black flake8
        echo "Running static analysis..."
        black --check .
        flake8 .
        
    - name: Run Tests
      run: |
        echo "Running integration and unit tests for Authentication Service..."
        pytest
